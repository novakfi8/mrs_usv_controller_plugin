#!/usr/bin/env python
PACKAGE = "mrs_usv_controller_plugin"

import roslib;
roslib.load_manifest(PACKAGE)

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

general = gen.add_group("General");
general.add("publish_zero_outputs", bool_t, 0, "Publish zero outputs", True)
general.add("max_cmd_heading_rate", double_t, 0, "Max heading rate command of heading rate PID", 0.0, 0.0, 4.0)
general.add("max_cmd_velocity", double_t, 0, "Max velocity command of heading rate PID", 0.0, 0.0, 4.0)
general.add("low_position_error", double_t, 0, "Low position error", 0.0, 0.0, 4.0)
general.add("max_position_error", double_t, 0, "Max position error", 0.0, 0.0, 4.0)

heading_rate_pid = gen.add_group("PID_heading_rate");
heading_rate_pid.add("kp", double_t, 0, "Proportinal component of heading rate PID",  0.0, 0.0, 10.0)
heading_rate_pid.add("kd", double_t, 0, "Derivative component of heading rate PID", 0.0, 0.0, 10.0)
heading_rate_pid.add("ki", double_t, 0, "Integral component of heading rate PID", 0.0, 0.0, 10.0)
heading_rate_pid.add("saturation", double_t, 0, "Saturation parameter of heading rate PID", 0.0, 0.0, 100.0)
heading_rate_pid.add("antiwindup", double_t, 0, "AntiWindup parameter of heading rate PID", 0.0, 0.0, 100.0)
heading_rate_pid.add("low_heading_error", double_t, 0, "Low heading error constant of heading rate PID", 0.0, 0.0, 4.0)
heading_rate_pid.add("max_heading_error", double_t, 0, "Max heading error constant of heading rate PID", 0.0, 0.0, 4.0)

exit(gen.generate(PACKAGE, "MrsUsvController", "mrs_usv_controller"))
