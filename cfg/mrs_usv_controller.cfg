#!/usr/bin/env python
PACKAGE = "mrs_usv_controller_plugin"

import roslib;
roslib.load_manifest(PACKAGE)

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

general = gen.add_group("General")
general.add("debug", bool_t, 0, "Show debug prints", True)
general.add("publish_zero_outputs", bool_t, 0, "Publish zero outputs", True)

controller = gen.add_group("Controller")
controller.add("desired_heading_to_final_reference", bool_t, 0, "Compute desired heading to final reference from tracker command", False)
controller.add("max_cmd_heading_rate", double_t, 0, "Max heading rate command of heading rate PID", 0.0, 0.0, 4.0)
controller.add("max_cmd_velocity", double_t, 0, "Max velocity command of heading rate PID", 0.0, 0.0, 4.0)
controller.add("enforce_constraints", bool_t, 0, "Enforce controller constraints (tracker)", False)
controller.add("horizontal_speed_constraint", double_t, 0, "Horizontal speed constraint", 0.0, 0.0, 5.0)
controller.add("vertical_asc_speed_constraint", double_t, 0, "Vertical asc speed constraint", 0.0, 0.0, 5.0)


position_pid = gen.add_group("PID_position")
position_pid.add("kp_position", double_t, 0, "Proportinal component of position PID",  0.0, 0.0, 10.0)
position_pid.add("kd_position", double_t, 0, "Derivative component of position PID", 0.0, 0.0, 10.0)
position_pid.add("ki_position", double_t, 0, "Integral component of position PID", 0.0, 0.0, 10.0)
position_pid.add("saturation_position", double_t, 0, "Saturation parameter of position PID", 0.0, 0.0, 100.0)
position_pid.add("antiwindup_position", double_t, 0, "AntiWindup parameter of position PID", 0.0, 0.0, 100.0)
position_pid.add("low_position_error", double_t, 0, "Low position error", 0.0, 0.0, 4.0)
position_pid.add("max_position_error", double_t, 0, "Max position error", 0.0, 0.0, 4.0)

heading_rate_pid = gen.add_group("PID_heading_rate");
heading_rate_pid.add("kp_heading_rate", double_t, 0, "Proportinal component of heading rate PID",  0.0, 0.0, 10.0)
heading_rate_pid.add("kd_heading_rate", double_t, 0, "Derivative component of heading rate PID", 0.0, 0.0, 10.0)
heading_rate_pid.add("ki_heading_rate", double_t, 0, "Integral component of heading rate PID", 0.0, 0.0, 10.0)
heading_rate_pid.add("saturation_heading_rate", double_t, 0, "Saturation parameter of heading rate PID", 0.0, 0.0, 100.0)
heading_rate_pid.add("antiwindup_heading_rate", double_t, 0, "AntiWindup parameter of heading rate PID", 0.0, 0.0, 100.0)
heading_rate_pid.add("low_heading_error", double_t, 0, "Low heading error constant of heading rate PID", 0.0, 0.0, 4.0)
heading_rate_pid.add("max_heading_error", double_t, 0, "Max heading error constant of heading rate PID", 0.0, 0.0, 4.0)

exit(gen.generate(PACKAGE, "MrsUsvController", "mrs_usv_controller"))
