# Parameters for MRS USV controller
debug: True
publish_zero_outputs: False 

## | ----------------------- controller ----------------------- #
desired_heading_to_final_reference: False
max_cmd_velocity: 1.5
max_cmd_heading_rate: 0.5
enforce_constraints: True
horizontal_speed_constraint: 3.0
vertical_asc_speed_constraint: 0.0

## | --------------------- state machines --------------------- #
low_position_error: 0.7
max_position_error: 1.0 

low_heading_error: 0.35
max_heading_error: 0.5

## | --------------------- PID - position --------------------- #
kp_position: 0.4
kd_position: 0.01
ki_position: 0.001
saturation_position: 2.0
antiwindup_position: 5.0

## | ---------------------- PID - heading --------------------- #
kp_heading_rate: 1.0
kd_heading_rate: 0.01
ki_heading_rate: 0.001
saturation_heading_rate: 0.5
antiwindup_heading_rate: 0.5




